<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Align</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #fafafa; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', system-ui, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
      .mark { width: 72px; height: 72px; border-radius: 22px; background: #fafafa; color: #000; display: grid; place-items: center; }
      h1 { margin: 8px 0 0; font-size: 28px; text-wrap: balance; }
      p { margin: 0; color: #9a9aa1; max-width: 300px; line-height: 1.45; text-wrap: pretty; }
      button { margin-top: 10px; height: 50px; padding: 0 26px; border: 0; border-radius: 999px; background: #fafafa; color: #000; font-size: 16px; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">
        <svg width="42" height="42" viewBox="0 0 48 48" aria-hidden="true"><rect x="9" y="11" width="22" height="6" rx="3" fill="currentColor" opacity="0.45"/><rect x="13" y="21" width="26" height="6" rx="3" fill="currentColor" opacity="0.7"/><rect x="9" y="31" width="30" height="6" rx="3" fill="currentColor"/></svg>
      </div>
      <h1>You Are Offline</h1>
      <p>Align always shows your live plan, so it needs a connection. Try again once you are back online.</p>
      <button onclick="location.reload()">Try Again</button>
    </main>
  </body>
</html>
